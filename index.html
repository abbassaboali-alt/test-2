/* 1️⃣ الصفحة بكامل العرض */
html, body{

const db = firebase.firestore();

/* ================= GLOBALS ================= */
let records = [];
let chartCounter = 0;

/* ✅ منع الضغط المتكرر */
let SEARCH_LOADING = false;
/* ================= HELPERS ================= */
const score=v=>v==="Excellent"?4:v==="Very Good"?3:v==="Good"?2:1;
function finalEval(e){
  const a=(score(e.fluency)+score(e.grammar)+score(e.listening)+score(e.confidence))/4;
  if(a>=3.5)return{t:"Excellent",c:"#0a7a43"};
  if(a>=2.75)return{t:"Very Good",c:"#2980b9"};
  if(a>=2)return{t:"Good",c:"#f1c40f"};
  return{t:"Needs Improvement",c:"#c0392b"};
}

/* ================= SEARCH (NO DUPLICATES) ================= */
/* ================= SEARCH ================= */
async function searchStudent(){

  if(SEARCH_LOADING){
    return;
  }

  SEARCH_LOADING = true;
  searchBtn.disabled = true;
  searchBtn.innerText = "جاري التحميل...";

  try{

    const iqama = iqamaInput.value.trim();

    if(!iqama){
      alert("أدخل الهوية");
      return;
    }

    result.innerHTML = "";
    records = [];
    chartCounter = 0;

    const uniqueEvalIds = new Set();

    const studentsSnap = await db.collection("students")
      .where("iqama","==",iqama)
      .get();

    if(studentsSnap.empty){
      alert("الطالب غير موجود");
      return;
    }

    for(const sDoc of studentsSnap.docs){

      const student = sDoc.data();
      const studentId = sDoc.id;

      const evalSnap = await db.collection("conversationEvaluations")
        .where("studentId","==",studentId)
        .get();

      for(const eDoc of evalSnap.docs){

        if(uniqueEvalIds.has(eDoc.id)) continue;
        uniqueEvalIds.add(eDoc.id);

        const e = eDoc.data();

        let start = "-";
        let end = "-";

        const courseId = e.courseId || student.courseId || null;

        if(courseId){
          const cDoc = await db.collection("Courses").doc(courseId).get();

          if(cDoc.exists){
            start = cDoc.data().StartingDate || "-";
            end   = cDoc.data().EndingDate   || "-";
          }
        }

        records.push({
          student,
          e,
          start,
          end
        });
      }
    }

    if(!records.length){
      alert("لا توجد تقييمات");
      return;
    }

    records.sort((a,b)=>{

      const levelA = Number(
        String(a.e.TrainingCourse || "").match(/\d+/)?.[0] || 0
      );

      const levelB = Number(
        String(b.e.TrainingCourse || "").match(/\d+/)?.[0] || 0
      );

      return levelA - levelB;
    });

    records.forEach((r,index)=>{

      const e = r.e;
      const student = r.student;
      const f = finalEval(e);

      chartCounter++;

      const chartId = "chart_" + chartCounter;

      result.innerHTML += `

        <div class="record-wrap">

          <div class="record-title"
               style="
                 font-size:28px;
                 color:#164478;
                 text-align:center;
               ">
            📘 ${e.TrainingCourse || ("Level-" + (index+1))}
          </div>

          <table>
            <tr><th>الاسم</th><td>${student.name || "-"}</td></tr>
            <tr><th>الهوية</th><td>${student.iqama || "-"}</td></tr>
            <tr><th>الدورة</th><td>${e.TrainingCourse || "-"}</td></tr>
            <tr><th>المدرب</th><td>${e.trainer || "-"}</td></tr>
            <tr><th>مدة الدورة</th><td>${r.start} → ${r.end}</td></tr>

            <tr>
              <th>التقييم النهائي</th>
              <td style="color:${f.c};font-weight:900">${f.t}</td>
            </tr>

            <tr><th>ملاحظة المدرب</th><td>${e.notes || "-"}</td></tr>
          </table>

          <div style="
            margin-top:30px;
            background:#fff;
            border:2px solid #dbeafe;
            border-radius:20px;
            padding:20px;
          ">

            <div style="
              text-align:center;
              font-size:24px;
              font-weight:900;
              color:#164478;
              margin-bottom:20px;
            ">
              📊 تقييم المهارات
            </div>

            <canvas id="${chartId}" height="120"></canvas>

          </div>

          <button onclick="exportCertificatePDF(${index})">
            تحميل شهادة PDF
          </button>

        </div>
      `;

/* =========================
   DRAW CHART SAFE
========================= */

setTimeout(()=>{

  drawChart(e, chartId);

},100);
    });

  }catch(err){

    console.error(err);
    alert("حدث خطأ أثناء التحميل");

  }finally{

    SEARCH_LOADING = false;
    searchBtn.disabled = false;
    searchBtn.innerText = "بحث";

  }

} /* ================= CHART ================= */
function drawChart(e,id){

  const canvas =
    document.getElementById(id);

  if(!canvas) return;

  const ctx =
    canvas.getContext("2d");

  /* ✅ تدمير أي رسم قديم */
  if(canvas.chartInstance){

    canvas.chartInstance.destroy();

  }

  canvas.chartInstance =
    new Chart(ctx,{

      type:"bar",

      data:{

        labels:[

          "Fluency",
          "Grammar",
          "Listening",
          "Confidence"

        ],

        datasets:[{

          data:[

            score(e.fluency),
            score(e.grammar),
            score(e.listening),
            score(e.confidence)

          ],

          backgroundColor:[

            "#164478",
            "#1d4ed8",
            "#2563eb",
            "#60a5fa"

          ],

          borderRadius:12,

          barThickness:42

        }]

      },

      options:{

        responsive:true,

        maintainAspectRatio:false,

        plugins:{
          legend:{
            display:false
          }
        },

        scales:{

          y:{
            min:0,
            max:4,
            ticks:{
              stepSize:1
            }
          }

        }

      }

    });

}/* ================= CERTIFICATE PDF ================= */
function exportCertificatePDF(i){
  const r = records[i];
  if(!r) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("landscape","mm","a4");

  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const C = W/2;

  doc.setDrawColor(22,68,120);
  doc.setLineWidth(3);
  doc.rect(10,10,W-20,H-20);

  /* شعار مائي */
  if(LOGO_1){
    doc.setGState(new doc.GState({opacity:0.06}));
    doc.addImage(LOGO_1,"PNG",W/2-90,H/2-55,180,110);
    doc.setGState(new doc.GState({opacity:1}));
  }

  /* شعارات أعلى */
  if(LOGO_1) doc.addImage(LOGO_1,"PNG",140,18,32,18);
  if(LOGO_2) doc.addImage(LOGO_2,"PNG",W/2-130,18,32,18);

  doc.setFont("helvetica","bold");
  doc.setFontSize(26);
  doc.setTextColor(22,68,120);
  doc.text("CERTIFICATE OF COMPLETION",C,70,{align:"center"});

  doc.setFontSize(14);
  doc.setTextColor(0);
  doc.text("This certificate is proudly presented to",C,84,{align:"center"});

  doc.setFontSize(22);
  doc.text(r.student.name,C,100,{align:"center"});

  doc.setFontSize(13);
  doc.text(`ID Number: ${r.student.iqama}`,C,112,{align:"center"});

  doc.text(`From ${r.start} to ${r.end}`,C,124,{align:"center"});

  const f = finalEval(r.e);
  doc.setFontSize(18);
  doc.text(`Final Evaluation: ${f.t}`,C,154,{align:"center"});

  if(STAMP_IMG) doc.addImage(STAMP_IMG,"PNG",40,H-65,40,40);
  if(SIGN_IMG)  doc.addImage(SIGN_IMG,"PNG",W-85,H-55,45,25);

  doc.setFontSize(12);
  doc.text(DIRECTOR_NAME,W-62,H-74,{align:"center"});
  doc.text("Institute Director",W-62,H-66,{align:"center"});

  doc.save(`Prudle_Certificate_${r.student.iqama}_${i+1}.pdf`);
}
