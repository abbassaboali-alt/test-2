<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔐 استعلام تقييم المحادثة</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>

<!-- Chart.js -->

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:'Tajawal',sans-serif;
  background:#f4f6fb;
  padding:20px;
  color:#164478;
}
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}
h2{text-align:center;font-weight:900}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px;
}
button{
  background:#164478;
  color:white;
  font-weight:800;
  cursor:pointer;
}
button:hover{background:#1e5799}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{background:#164478;color:white}
.badge{
  padding:6px 14px;
  border-radius:20px;
  color:white;
  font-weight:800;
}
canvas{
  max-width:400px;
  margin:20px auto;
  display:block;
}
.link{
  color:#164478;
  font-weight:800;
  text-decoration:none;
}
</style>
</head>

<body>
<div class="container">

<h2>🔐 استعلام تقييم المحادثة</h2>

<input id="iqamaInput" placeholder="أدخل رقم الهوية / الإقامة">
<button onclick="searchStudent()">استعلام</button>

<div id="result"></div>

</div>

<canvas id="chart" height="180"></canvas>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey:"AIzaSyCCFBvZosI8dwShZjxvZzI-SU5igEbcOKk",
  projectId:"prudle-system"
});
const db = firebase.firestore();

/* ================= FINAL EVALUATION ================= */
function score(v){
  return v==="Excellent"?4:v==="Very Good"?3:v==="Good"?2:1;
}
function finalEval(e){
  let avg=(score(e.fluency)+score(e.grammar)+score(e.listening)+score(e.confidence))/4;
  if(avg>=3.5)return{t:"Excellent",c:"#0a7a43"};
  if(avg>=2.75)return{t:"Very Good",c:"#2980b9"};
  if(avg>=2)return{t:"Good",c:"#f1c40f"};
  return{t:"Needs Improvement",c:"#c0392b"};
}

let currentStudent=null;
let currentEval=null;

/* ================= SEARCH ================= */
async function searchStudent(){
  let iqama = iqamaInput.value.trim();
  if(!iqama) return alert("أدخل رقم الهوية");

  let stuSnap = await db.collection("students")
    .where("iqama","==",iqama).get();

  if(stuSnap.empty){
    result.innerHTML="<p style='color:red;text-align:center'>لا يوجد طالب بهذا الرقم</p>";
    return;
  }

  currentStudent = stuSnap.docs[0].data();

  let evalSnap = await db.collection("conversationEvaluations")
    .where("student","==",currentStudent.name).get();

  if(evalSnap.empty){
    result.innerHTML="<p style='text-align:center'>لا توجد تقييمات مسجلة</p>";
    return;
  }

  currentEval = evalSnap.docs[0].data();
  let f = finalEval(currentEval);

  result.innerHTML = `
  <table>
    <tr><th>اسم الطالب</th><td>${currentStudent.name}</td></tr>
    <tr><th>رقم الهوية</th><td>${currentStudent.iqama}</td></tr>
    <tr><th>الدورة</th><td>${currentEval.TrainingCourse}</td></tr>
    <tr><th>المدرب</th><td>${currentEval.trainer}</td></tr>
    <tr><th>Fluency</th><td>${currentEval.fluency}</td></tr>
    <tr><th>Grammar</th><td>${currentEval.grammar}</td></tr>
    <tr><th>Listening</th><td>${currentEval.listening}</td></tr>
    <tr><th>Confidence</th><td>${currentEval.confidence}</td></tr>
    <tr>
      <th>التقييم النهائي</th>
      <td><span class="badge" style="background:${f.c}">${f.t}</span></td>
    </tr>
    <tr><th>تعليق المدرب</th><td>${currentEval.notes||"-"}</td></tr>
    ${
      currentEval.attachedPDF
      ? `<tr><th>الشهادات</th><td><a class="link" href="${currentEval.attachedPDF}" target="_blank">📄 تحميل الشهادة</a></td></tr>`
      : `<tr><th>الشهادات</th><td>لا يوجد ملف مرفق</td></tr>`
    }
  </table>

  <button onclick="exportPDF()">📄 تحميل PDF</button>
  `;

  drawChart(currentEval);
}

/* ================= CHART (BAR – SMALL) ================= */
function drawChart(e){
  if(window.evalChart) window.evalChart.destroy();

  window.evalChart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels:["Fluency","Grammar","Listening","Confidence"],
      datasets:[{
        data:[
          score(e.fluency),
          score(e.grammar),
          score(e.listening),
          score(e.confidence)
        ],
        backgroundColor:["#27ae60","#2980b9","#f1c40f","#c0392b"]
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        y:{min:0,max:4,ticks:{stepSize:1}}
      }
    }
  });
}
