/* ===== Evaluation ===== */
function score(v){return v==="Excellent"?4:v==="Very Good"?3:v==="Good"?2:1}
function finalEval(e){
  let a=(score(e.fluency)+score(e.grammar)+score(e.listening)+score(e.confidence))/4;
  if(a>=3.5) return {t:"Excellent",hex:"#0a7a43",rgb:[10,122,67]};
  if(a>=2.75) return {t:"Very Good",hex:"#2980b9",rgb:[41,128,185]};
  if(a>=2) return {t:"Good",hex:"#f1c40f",rgb:[241,196,15]};
  return {t:"Needs Improvement",hex:"#c0392b",rgb:[192,57,43]};
}

/* ===== Load Data ===== */
let COURSES=[],EVALS=[],FILTERED=[];

/* ✅ Students Maps (name -> iqama) + (iqama -> iqama) */
let STUDENTS_BY_NAME = {};   // key: normalized name
let STUDENTS_BY_IQAMA = {};  // key: iqama string

function normName(x){
  return (x||"").toString().trim().toLowerCase().replace(/\s+/g," ");
}
function normId(x){
  return (x||"").toString().trim();
}

/* ✅ تحميل الطلاب (مرة واحدة + لحظي) */
db.collection("students").onSnapshot(s=>{
  STUDENTS_BY_NAME = {};
  STUDENTS_BY_IQAMA = {};

  s.docs.forEach(d=>{
    let st = d.data() || {};
    let name = st.name || st.StudentName || st.student || "";
    let iqama = st.iqama || st.Iqama || st.idNumber || st.ID || "";

    let n = normName(name);
    let id = normId(iqama);

    if(n && id) STUDENTS_BY_NAME[n] = id;
    if(id) STUDENTS_BY_IQAMA[id] = id;
  });

  // إعادة رسم الجدول لو البيانات موجودة
  if(EVALS.length) applyFilters();
});

/* ✅ جلب الهوية من students */
function getIqamaForEval(e){
  // 1) لو التقييم فيه studentId (وفيه iqama أصلاً) نستخدمه للبحث
  let sid = normId(e.studentId || e.StudentID || e.iqama || e.Iqama || "");
  if(sid && STUDENTS_BY_IQAMA[sid]) return STUDENTS_BY_IQAMA[sid];

  // 2) غير كذا نطابق بالاسم
  let nm = normName(e.student || e.Student || "");
  if(nm && STUDENTS_BY_NAME[nm]) return STUDENTS_BY_NAME[nm];

  return "-";
}

/* ===== Courses ===== */
db.collection("Courses").get().then(s=>{
  COURSES=s.docs.map(d=>d.data());
  ["Branch","Section","Trainer","TrainingCourse","StartingDate"].forEach(f=>{
    let id=f==="TrainingCourse"?"courseFilter":
           f==="StartingDate"?"startDateFilter":f.toLowerCase()+"Filter";
    [...new Set(COURSES.map(c=>c[f]).filter(Boolean))].forEach(v=>{
      document.getElementById(id).innerHTML+=`<option>${v}</option>`;
    });
  });
});

/* إصلاح فلتر الفترة */
document.getElementById("periodFilter").addEventListener("click",()=>{
  let pf=document.getElementById("periodFilter");
  let cur=pf.value;
  pf.innerHTML='<option value="">الفترة</option>';
  [...new Set(COURSES.map(c=>c.Period).filter(p=>p))].forEach(p=>{
    pf.innerHTML+=`<option value="${p}">${p}</option>`;
  });
  pf.value=cur;
});

/* ===== Evaluations ===== */
db.collection("conversationEvaluations").onSnapshot(s=>{
  EVALS=s.docs.map(d=>({id:d.id,...d.data()}));
  applyFilters();
});
document.querySelectorAll(".filters select").forEach(el=>el.addEventListener("change",applyFilters));

function applyFilters(){
  let bf=branchFilter.value,sf=sectionFilter.value,tf=trainerFilter.value,
      cf=courseFilter.value,pf=periodFilter.value,df=startDateFilter.value;

  if(!bf&&!sf&&!tf&&!cf&&!pf&&!df){
    reportTable.classList.add("hidden");note.classList.remove("hidden");return;
  }
  note.classList.add("hidden");reportTable.classList.remove("hidden");

  FILTERED=EVALS.filter(e=>{
    let c=COURSES.find(x=>x.TrainingCourse===e.TrainingCourse);
    return (!bf||c?.Branch===bf)&&(!sf||c?.Section===sf)&&
           (!tf||e.trainer===tf)&&(!cf||e.TrainingCourse===cf)&&
           (!pf||c?.Period===pf)&&(!df||c?.StartingDate===df);
  });

  let tb=document.querySelector("#reportTable tbody");
  tb.innerHTML="";
  FILTERED.forEach(e=>{
    let c=COURSES.find(x=>x.TrainingCourse===e.TrainingCourse);
    let f=finalEval(e);
    let iq = getIqamaForEval(e);

    tb.innerHTML+=`
    <tr>
      <td><input type="checkbox" class="rowCheck" data-id="${e.id}"></td>
      <td>${e.student||"-"}</td>
      <td>${iq}</td>
      <td>${e.trainer||"-"}</td>
      <td>${e.TrainingCourse||"-"}</td>
      <td>${c?.Period||"-"}</td>
      <td>${c?.StartingDate||"-"}</td>
      <td>${e.fluency||"-"}</td>
      <td>${e.grammar||"-"}</td>
      <td>${e.listening||"-"}</td>
      <td>${e.confidence||"-"}</td>
      <td><span class="eval-badge" style="background:${f.hex}">${f.t}</span></td>
      <td>${e.notes||""}</td>
      <td>${e.attachedPDF?`<a href="${e.attachedPDF}" target="_blank">📄</a>`:"—"}</td>
      <td><input type="file" accept="application/pdf" onchange="uploadPDF(this,'${e.id}')"></td>
    </tr>`;
  });
}

/* ===== رسم دائري مع كتابة البيانات ===== */
function drawPieChart(e){
  let canvas=document.getElementById("pdfChart");
  let ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let data=[
    {label:"Fluency",value:score(e.fluency),color:"#3498db"},
    {label:"Grammar",value:score(e.grammar),color:"#9b59b6"},
    {label:"Listening",value:score(e.listening),color:"#1abc9c"},
    {label:"Confidence",value:score(e.confidence),color:"#e67e22"}
  ];
  let total=data.reduce((s,d)=>s+d.value,0);
  let cx=150,cy=150,r=90,start=0;
  ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.textBaseline="middle";

  data.forEach(d=>{
    let slice=(d.value/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+slice);ctx.closePath();
    ctx.fillStyle=d.color;ctx.fill();
    let mid=start+slice/2;
    let tx=cx+Math.cos(mid)*(r*0.6);
    let ty=cy+Math.sin(mid)*(r*0.6);
    ctx.fillStyle="#fff";
    ctx.fillText(d.label,tx,ty-6);
    ctx.fillText(d.value+"/4",tx,ty+8);
    start+=slice;
  });
  return canvas.toDataURL("image/png");
}

/* ===== Upload / Delete ===== */
async function uploadPDF(input,id){
  if(!input.files[0]) return;
  let ref=storage.ref(`conversation_pdfs/${id}.pdf`);
  await ref.put(input.files[0]);
  let url=await ref.getDownloadURL();
  await db.collection("conversationEvaluations").doc(id).update({attachedPDF:url});
  alert("تم رفع الملف");
}
function toggleAll(el){document.querySelectorAll(".rowCheck").forEach(c=>c.checked=el.checked);}
async function deleteSelected(){
  let ids=[...document.querySelectorAll(".rowCheck:checked")].map(c=>c.dataset.id);
  if(!ids.length||!confirm("تأكيد الحذف؟")) return;
  for(let id of ids){
    await db.collection("conversationEvaluations").doc(id).delete();
    await storage.ref(`conversation_pdfs/${id}.pdf`).delete().catch(()=>{});
  }
  alert("تم الحذف");
}
